name: Publicar en el repositorio de Jellyfin

# Se ejecuta al subir `version` en build.yaml (y Directory.Build.props) a main: ejecuta los tests,
# construye el plugin con jprm y guarda el ZIP y el manifest.json nuevos en repo/.
# Si esa versión ya estaba publicada no hace nada (scripts/publish-repo.sh termina con 2).
on:
  push:
    branches: [main]
    paths: [build.yaml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-repo
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      REPO_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/main/repo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Instalar jprm
        run: pip install jprm

      - name: Tests
        run: dotnet test Jellyfin.Plugin.JellyChannels.slnx --configuration Release

      - name: Construir y añadir al repositorio
        run: |
          set +e
          scripts/publish-repo.sh
          code=$?
          if [ "$code" -eq 2 ]; then
            echo "Esa versión ya estaba publicada: no hay nada que hacer."
            exit 0
          fi
          exit "$code"

      - name: Guardar el repositorio en main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repo
          if git diff --cached --quiet; then
            echo "Sin cambios en repo/."
            exit 0
          fi
          version=$(sed -n 's/^version: "\(.*\)"/\1/p' build.yaml)
          git commit -m "Publica la versión ${version} en el repositorio de Jellyfin"
          git push origin HEAD:main
