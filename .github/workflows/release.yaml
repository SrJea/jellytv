name: Publicar release

# Construye el plugin y crea un release de GitHub con el ZIP y el manifest.json del repositorio de
# Jellyfin como assets. Se lanza de dos maneras:
#   - Subiendo una etiqueta v<versión> (por ejemplo v0.6.0.0), que debe coincidir con la versión de build.yaml.
#   - A mano, desde Actions > Publicar release > Run workflow: crea la etiqueta v<versión> sobre el commit
#     de la rama elegida (la workflow_dispatch solo aparece cuando este fichero está en la rama por defecto).
#
# En Jellyfin se añade como repositorio la URL
#   https://github.com/<usuario>/<repo>/releases/latest/download/manifest.json
# que siempre apunta al manifiesto del último release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Calcular la etiqueta y comprobar que coincide con la versión
        run: |
          version=$(sed -n 's/^version: "\(.*\)"/\1/p' build.yaml)
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "La etiqueta $GITHUB_REF_NAME no coincide con la versión de build.yaml (v$version)." >&2
            exit 1
          fi
          echo "TAG=v$version" >> "$GITHUB_ENV"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Instalar jprm
        run: pip install jprm

      - name: Tests
        run: dotnet test Jellyfin.Plugin.JellyChannels.slnx --configuration Release

      - name: Manifiesto del release anterior
        run: gh release download --repo "$GITHUB_REPOSITORY" --pattern manifest.json --dir previous || echo "No hay release anterior."

      - name: Construir el ZIP y el manifiesto
        env:
          PREVIOUS_MANIFEST: previous/manifest.json
        run: RELEASE_URL_BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}" scripts/build-release.sh

      - name: Crear el release
        run: |
          gh release create "$TAG" dist/*.zip dist/manifest.json \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "JellyChannels ${TAG#v}" \
            --notes-file dist/RELEASE_NOTES.md
